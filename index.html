const CATNAME=['全部音效','影片一','影片二','影片三','影片四','我的收藏'];
const CATICON=['⌂','◉','◉','◉','◉','★'];
const SOURCES=['','audio/01.mp3','audio/02.mp3','audio/03.mp3','audio/04.mp3'];
const ENDS=[0,95.32,107.55,136.25,111.78];
const get=id=>document.getElementById(id);
const fmt=n=>{n=Math.max(0,Math.floor(n||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='wang-soundpad-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(e){}
let cat=0,layout=saved.layout==='list'?'list':'grid',favorites=new Set(saved.favorites||[]),cuts=saved.cuts||{},counts=saved.counts||{},selected=null,active=null,playing=false,loop=!!saved.loop,shuffle=!!saved.shuffle,timeoutHandle=null,watchHandle=null,queueToken=0;
const audio=new Audio();audio.preload='auto';audio.volume=Math.max(0,Math.min(1,(saved.volume??85)/100));
const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify({layout,favorites:[...favorites],cuts,counts,volume:Math.round(audio.volume*100),loop,shuffle}))}catch(e){}};
const clip=c=>cuts[c.id]||{start:c.start,end:c.end};
const visible=()=>CATALOG.filter(c=>(cat===0||cat===5&&favorites.has(c.id)||cat===c.cat)&&c.text.toLowerCase().includes(get('search').value.trim().toLowerCase()));
const notify=s=>{const e=get('toast');e.textContent=s;e.classList.add('visible');clearTimeout(e._id);e._id=setTimeout(()=>e.classList.remove('visible'),4200)};
function renderNav(){let arr=[0,1,2,3,4,5];const count=i=>i===0?CATALOG.length:i===5?favorites.size:CATALOG.filter(c=>c.cat===i).length;get('navList').innerHTML=arr.map(i=>'<button class="nav '+(cat===i?'selected':'')+'" data-cat="'+i+'"><span class="navicon">'+CATICON[i]+'</span>'+CATNAME[i]+'<span class="count">'+count(i)+'</span></button>').join('');
get('mobileCats').innerHTML=arr.map(i=>'<button data-cat="'+i+'" class="'+(cat===i?'selected':'')+'">'+CATNAME[i]+' '+count(i)+'</button>').join('');}
function render(){renderNav();const list=visible();get('catTitle').textContent=CATNAME[cat];get('catSubtitle').textContent='SOUND LIBRARY  /  '+list.length+' 個音效';get('statusCounts').textContent=list.length+' / '+CATALOG.length+' 個音效';get('gridMode').classList.toggle('active',layout==='grid');get('listMode').classList.toggle('active',layout==='list');
const area=get('soundArea');if(!list.length){area.innerHTML='<div class="empty"><div class="big">♫</div>沒有符合的語句</div>';return;}
if(layout==='grid'){area.className='grid';area.innerHTML=list.map(c=>{const d=clip(c);return '<button class="pad '+(active&&active.id===c.id&&playing?'playing':'')+'" data-play="'+c.id+'" title="'+esc(c.text)+'"><div class="padTop"><span>#'+String(c.id).padStart(3,'0')+' · 影片 '+c.cat+'</span><span>'+fmt(d.end-d.start)+'</span></div><div class="padTitle">'+esc(c.text)+'</div><div class="padFoot"><span class="soundline"></span><span>▶ 點擊播放</span><span class="star '+(favorites.has(c.id)?'saved':'')+'" role="button" tabindex="-1" aria-label="收藏" data-fav="'+c.id+'">'+(favorites.has(c.id)?'★':'☆')+'</span></div></button>'}).join('');}
else{area.className='';area.innerHTML='<table class="tabl"><thead><tr><th class="index">Index</th><th>Tag / 語句內容</th><th class="catcol">來源</th><th class="duration">Duration</th><th class="favcol">★</th></tr></thead><tbody>'+list.map(c=>'<tr data-play="'+c.id+'" class="'+(active&&active.id===c.id&&playing?'playing':'')+'"><td class="index">'+c.id+'</td><td title="'+esc(c.text)+'">'+esc(c.text)+'</td><td class="catcol">影片 '+c.cat+'</td><td class="duration">'+fmt(clip(c).end-clip(c).start)+'</td><td class="favcol"><button class="star '+(favorites.has(c.id)?'saved':'')+'" data-fav="'+c.id+'" aria-label="收藏">'+(favorites.has(c.id)?'★':'☆')+'</button></td></tr>').join('')+'</tbody></table>';}
}
function select(c){selected=c;get('editor').classList.remove('hide');get('selectedTitle').textContent=c.text;get('selectedMeta').textContent='來源影片 '+c.cat+' · 文字卡約 '+c.stamp+' · 第 '+c.n+' 句';get('startInput').value=clip(c).start.toFixed(2);get('endInput').value=clip(c).end.toFixed(2);}
function clearMonitors(){clearInterval(watchHandle);watchHandle=null;clearTimeout(timeoutHandle);timeoutHandle=null}
function stop(reset=true){queueToken++;clearMonitors();audio.pause();playing=false;if(reset){active=null;audio.removeAttribute('src');audio.load();get('seek').value=0;get('clock').textContent='0:00 / 0:00';get('nowPlaying').textContent='未選取音效';get('state').textContent='就緒';}else get('state').textContent='已暫停';get('play').textContent='▶';render();}
function monitor(){clearMonitors();watchHandle=setInterval(()=>{if(!active||!playing)return;const c=clip(active);const elapsed=Math.max(0,audio.currentTime-c.start);const duration=c.end-c.start;get('clock').textContent=fmt(elapsed)+' / '+fmt(duration);get('seek').value=Math.min(1000,Math.round(elapsed/duration*1000));if(audio.currentTime>=c.end-0.035)done();},35);}
function done(){if(!active||!playing)return;const c=active;audio.pause();playing=false;clearMonitors();if(loop){playClip(c);return;}get('play').textContent='▶';get('state').textContent='播放完成';get('seek').value=1000;render();}
function playClip(c,offset=0){if(!c)return;queueToken++;const token=queueToken;clearMonitors();audio.pause();active=c;select(c);const ct=clip(c);if(ct.end<=ct.start)return notify('切點設定不正確');const newSrc=new URL(SOURCES[c.cat],location.href).href;if(audio.src!==newSrc){audio.src=SOURCES[c.cat];audio.load();}
const start=Math.min(ct.end-.05,ct.start+Math.max(0,offset));try{audio.currentTime=start}catch(e){}
get('play').textContent='Ⅱ';get('state').textContent='載入中';get('nowPlaying').textContent=c.text;get('clock').textContent='0:00 / '+fmt(ct.end-ct.start);get('seek').value=0;
const p=audio.play();if(p&&p.then)p.then(()=>{if(token!==queueToken)return;playing=true;get('state').textContent='播放中';counts[c.id]=(counts[c.id]||0)+1;persist();monitor();render();}).catch(err=>{if(token!==queueToken)return;playing=false;get('play').textContent='▶';get('state').textContent='播放失敗';notify('音軌載入失敗：請確認 audio/0'+c.cat+'.mp3 已上傳並使用網站伺服器開啟');render();});else{playing=true;monitor();render();}}
function togglePlay(){if(playing){clearMonitors();audio.pause();playing=false;get('play').textContent='▶';get('state').textContent='已暫停';render();return;}if(!active){playClip(visible()[0]||CATALOG[0]);return;}const c=clip(active);if(!audio.src||audio.currentTime>=c.end-.04)playClip(active);else{const p=audio.play();if(p&&p.catch)p.catch(()=>notify('播放被瀏覽器阻擋'));playing=true;get('play').textContent='Ⅱ';get('state').textContent='播放中';monitor();render();}}
function step(dir){const list=visible();if(!list.length)return;let i=active?list.findIndex(c=>c.id===active.id):-1;const target=shuffle?list[Math.floor(Math.random()*list.length)]:list[(i+dir+list.length)%list.length];playClip(target);}
function setCat(i){cat=i;get('scroller').scrollTop=0;render();}
get('soundArea').addEventListener('click',e=>{const star=e.target.closest('[data-fav]');if(star){e.stopPropagation();const id=+star.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);persist();render();return;}const row=e.target.closest('[data-play]');if(row)playClip(CATALOG.find(c=>c.id===+row.dataset.play));});
document.addEventListener('click',e=>{const n=e.target.closest('[data-cat]');if(n)setCat(+n.dataset.cat);});
get('search').addEventListener('input',render);get('gridMode').onclick=()=>{layout='grid';persist();render()};get('listMode').onclick=()=>{layout='list';persist();render()};get('menuAll').onclick=()=>setCat(0);get('menuFav').onclick=()=>setCat(5);get('menuLayout').onclick=()=>{layout=layout==='grid'?'list':'grid';persist();render()};
get('menuHelp').onclick=()=>notify('點選語句播放 · 空白鍵播放／暫停 · Esc 停止 · 1–9 播放目前篩選結果的前九句 · 選取後可在下方微調切點');
get('play').onclick=togglePlay;get('stop').onclick=()=>stop();get('prev').onclick=()=>step(-1);get('next').onclick=()=>step(1);
get('shuffle').onclick=()=>{shuffle=!shuffle;get('shuffle').classList.toggle('on',shuffle);persist()};get('loop').onclick=()=>{loop=!loop;get('loop').classList.toggle('on',loop);persist()};
get('volume').value=Math.round(audio.volume*100);get('volume').oninput=e=>{audio.volume=e.target.value/100;get('volIcon').textContent=audio.volume===0?'♪':'♫';persist()};
get('seek').oninput=e=>{if(!active)return;const ct=clip(active);const offset=(ct.end-ct.start)*e.target.value/1000;if(playing)playClip(active,offset);else{audio.currentTime=ct.start+offset;get('clock').textContent=fmt(offset)+' / '+fmt(ct.end-ct.start);}};
get('saveCut').onclick=()=>{if(!selected)return;const st=+get('startInput').value,en=+get('endInput').value;if(!Number.isFinite(st)||!Number.isFinite(en)||st<0||en>ENDS[selected.cat]||en-st<.3)return notify('切點無效：結束時間應大於開始時間至少 0.3 秒，且不能超過影片長度');cuts[selected.id]={start:+st.toFixed(2),end:+en.toFixed(2)};persist();if(active&&active.id===selected.id)stop(false);select(selected);render();notify('此語句的切點已儲存在目前瀏覽器');};
get('resetCut').onclick=()=>{if(!selected)return;delete cuts[selected.id];persist();select(selected);render();notify('已還原為預設切點');};
get('closeEditor').onclick=()=>get('editor').classList.add('hide');
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Escape'){e.preventDefault();stop();return;}if(e.key===' '){e.preventDefault();togglePlay();return;}if(/^[1-9]$/.test(e.key)){e.preventDefault();const c=visible()[+e.key-1];if(c)playClip(c);}});
audio.addEventListener('ended',done);
audio.addEventListener('error',()=>{if(active){get('state').textContent='音檔未就緒';}});
get('shuffle').classList.toggle('on',shuffle);get('loop').classList.toggle('on',loop);render();
</script></body></html>
