function visible(){return CLIPS.filter(c=>(cat===0||cat===5&&favorites.has(c.id)||cat===c.cat)&&c.text.toLowerCase().includes(query.toLowerCase()))}
function drawFilters(){
 $('filters').innerHTML=LABELS.map((text,i)=>'<button type="button" class="pill '+(i===cat?'active':'')+'" data-filter="'+i+'" aria-pressed="'+(i===cat)+'">'+text+(i===5?' '+favorites.size:'')+'</button>').join('');
}
function drawBoard(){
 const list=visible();$('summary').textContent=(cat===0?'全部語音':LABELS[cat])+' · '+list.length+' 句';
 if(!list.length){$('board').style.display='block';$('board').innerHTML='<div class="empty"><div class="emptyIcon">♫</div>沒有符合條件的語句</div>';return}
 $('board').style.display='grid';
 $('board').innerHTML=list.map(c=>'<article class="tile '+(active&&active.id===c.id&&isPlaying?'active':'')+'" data-tile="'+c.id+'"><button type="button" class="trigger" data-play="'+c.id+'" aria-label="播放：'+escapeHtml(c.text)+'"><span class="tileTop"><span class="ordinal">#'+String(c.id).padStart(2,'0')+'</span><span>影片 '+c.cat+'</span></span><span class="tileText">'+escapeHtml(c.text)+'</span><span class="tileFoot"><span class="playCircle" aria-hidden="true">'+(active&&active.id===c.id&&isPlaying?'Ⅱ':'▶')+'</span><span class="duration">'+minute(c.length)+'</span></span></button><button class="fav '+(favorites.has(c.id)?'marked':'')+'" type="button" data-fav="'+c.id+'" title="收藏" aria-label="'+(favorites.has(c.id)?'取消收藏':'收藏')+'">★</button></article>').join('');
}
function updateTileState(){document.querySelectorAll('[data-tile]').forEach(el=>{let same=active&&+el.dataset.tile===active.id&&isPlaying;el.classList.toggle('active',!!same);let icon=el.querySelector('.playCircle');if(icon)icon.textContent=same?'Ⅱ':'▶'});}
function stopSource(){if(playingSource){playingSource.onended=null;try{playingSource.stop()}catch(e){}try{playingSource.disconnect()}catch(e){}playingSource=null}if(animationId){cancelAnimationFrame(animationId);animationId=0}}
function halt(){ticket++;stopSource();isPlaying=false;pausedAt=0;active=null;duration=0;startedAt=0;updateDock();updateTileState();}
function updateDock(){
 $('stop').disabled=!active;$('toggle').disabled=!active;
 $('playerState').textContent=!active?'準備播放':isPlaying?'正在播放':'已暫停／可重播';
 $('playerTitle').textContent=active?active.text:'點選上方任何一句語音';
 $('toggleIcon').innerHTML=isPlaying?'<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>':'<path d="M7 4v16l13-8z"></path>';
 if(!active){$('progress').style.width='0%';$('time').textContent='0:00'}
}
function showError(message){const el=$('error');el.textContent=message;el.classList.add('show');clearTimeout(errorTimer);errorTimer=setTimeout(()=>el.classList.remove('show'),6200)}
function initAudio(){
 if(!context){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw new Error('此瀏覽器不支援音效播放');context=new C();gain=context.createGain();gain.connect(context.destination)}return context;
}
async function getAudio(cat){if(!cache.has(cat)){
 const promise=fetch(SRC[cat],{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('無法下載音軌：'+r.status);return r.arrayBuffer()}).then(bytes=>initAudio().decodeAudioData(bytes)).catch(err=>{cache.delete(cat);throw err});
 cache.set(cat,promise);
 }return cache.get(cat);
}
function tick(){
 if(!isPlaying||!active||!context)return;
 let elapsed=Math.max(0,Math.min(duration,pausedAt+context.currentTime-startedAt));
 $('progress').style.width=(duration?elapsed/duration*100:0)+'%';
 $('time').textContent=minute(elapsed)+' / '+minute(duration);
 animationId=requestAnimationFrame(tick);
}
async function playClip(c,offset=0){
 if(!c)return;
 ticket++;const thisTicket=ticket;stopSource();active=c;isPlaying=false;
 pausedAt=Math.max(0,offset);duration=c.end-c.start;updateDock();
 $('playerState').textContent='正在載入音效…';$('progress').style.width=(100*pausedAt/duration)+'%';
 updateTileState();
 try{
  const ac=initAudio();const resume=ac.resume();const buffer=await getAudio(c.cat);await resume;
  if(thisTicket!==ticket)return;
  const src=ac.createBufferSource();src.buffer=buffer;src.connect(gain);
  const maxDur=Math.min(duration-pausedAt,buffer.duration-(c.start+pausedAt));
  if(maxDur<=0.02)throw Error('剪輯時間超出音檔範圍');
  playingSource=src;startedAt=ac.currentTime;isPlaying=true;
  src.onended=()=>{if(thisTicket!==ticket||!isPlaying)return;playingSource=null;isPlaying=false;pausedAt=0;$('progress').style.width='100%';$('time').textContent=minute(duration)+' / '+minute(duration);updateDock();$('playerState').textContent='播放完成';updateTileState();if(animationId)cancelAnimationFrame(animationId)};
  src.start(0,c.start+pausedAt,maxDur);updateDock();updateTileState();tick();
 }catch(err){if(thisTicket!==ticket)return;isPlaying=false;updateDock();updateTileState();$('playerState').textContent='播放失敗';showError('音效無法播放，請確認網站的 audio 資料夾已有四個 MP3，並重新整理頁面。')}
}
function pause(){
 if(!isPlaying||!active)return;
 pausedAt=Math.max(0,Math.min(duration,pausedAt+context.currentTime-startedAt));
 ticket++;stopSource();isPlaying=false;updateDock();updateTileState();$('time').textContent=minute(pausedAt)+' / '+minute(duration);
}
$('board').addEventListener('click',e=>{
 const fav=e.target.closest('[data-fav]');if(fav){const id=+fav.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);persist();drawFilters();drawBoard();return}
 const btn=e.target.closest('[data-play]');if(btn){const c=CLIPS[+btn.dataset.play-1];playClip(c)}
});
$('filters').onclick=e=>{const btn=e.target.closest('[data-filter]');if(!btn)return;cat=+btn.dataset.filter;drawFilters();drawBoard()};
$('search').addEventListener('input',e=>{query=e.target.value.trim();$('clearSearch').classList.toggle('show',!!query);drawBoard()});
$('clearSearch').onclick=()=>{$('search').value='';query='';$('clearSearch').classList.remove('show');drawBoard();$('search').focus()};
$('stop').onclick=halt;
$('toggle').onclick=()=>{if(!active)return;if(isPlaying)pause();else playClip(active,pausedAt>=duration?0:pausedAt)};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Escape')halt();else if(e.code==='Space'&&active){e.preventDefault();if(isPlaying)pause();else playClip(active,pausedAt)}});
drawFilters();drawBoard();updateDock();
</script>
</body>
</html>
